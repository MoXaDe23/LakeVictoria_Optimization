[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "lake-victoria-observatory"
version = "0.1.0"
description = "A local, source-backed Lake Victoria policy observatory"
requires-python = ">=3.12"
dependencies = ["numpy>=2,<3", "pandas>=2.2,<4", "panel>=1.9,<2", "bokeh>=3.7,<3.10", "rasterio>=1.4,<2", "scipy>=1.14,<2", "pyarrow>=18", "pymoo>=0.6.1,<0.7"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["src*", "dashboard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
